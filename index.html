            function positionTeamTooltip(pointer) {
                const tooltip = document.getElementById("team-player-tooltip");
                if (!tooltip || !pointer) {
                    return;
                }

                const margin = 8;
                const offset = 14;
                const left = Math.min(
                    pointer.x + offset,
                    window.innerWidth - tooltip.offsetWidth - margin
                );
                const top = Math.min(
                    pointer.y + offset,
                    window.innerHeight - tooltip.offsetHeight - margin
                );
                tooltip.style.left = Math.max(margin, left) + "px";
                tooltip.style.top = Math.max(margin, top) + "px";
            }

                const tooltip = document.getElementById("team-player-tooltip");
                if (!tooltip) {
                    return;
                }

                function appendPlayerSection(titleText, edgeIds) {

                    title.textContent = team + " " + titleText;
