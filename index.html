                  var options = {"physics": {"enabled": false}, "interaction": {"hover": true, "navigationButtons": true, "tooltipDelay": 80, "multiselect": true}, "edges": {"font": {"size": 10, "align": "middle", "background": "rgba(255,255,255,0.88)"}, "arrowStrikethrough": false, "chosen": true}, "nodes": {"font": {"size": 14, "face": "Arial", "vadjust": 8}, "shapeProperties": {"useBorderWithImage": false}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    
        <script>
            function resizeNetworkCanvas() {
                const container = document.getElementById("mynetwork");

                if (!container) {
                    return;
                }

                container.style.width = window.innerWidth + "px";
                container.style.height = window.innerHeight + "px";

                network.setSize(
                    window.innerWidth + "px",
                    window.innerHeight + "px"
                );
                network.redraw();
            }

            window.addEventListener("load", function () {
                resizeNetworkCanvas();

                // Wait until logos and browser layout have settled.
                setTimeout(function () {
                    resizeNetworkCanvas();
                    network.fit({
                        animation: false
                    });
                }, 200);
            });

            window.addEventListener("resize", function () {
                resizeNetworkCanvas();
            });
        </script>
        </body>
        
</html>
