                if (!tooltip || !pointer) {

                const offset = 14;
                const left = Math.min(
                    pointer.x + offset,
                    window.innerWidth - tooltip.offsetWidth - margin

                const top = Math.min(
                    pointer.y + offset,
                    window.innerHeight - tooltip.offsetHeight - margin

                tooltip.style.left = Math.max(margin, left) + "px";
                tooltip.style.top = Math.max(margin, top) + "px";
